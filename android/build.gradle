group = "com.wzagroup.uxtracker.flutter"
version = "1.0.0-beta.1"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// The native SDK is resolved by the host app, so its repositories are added to every project of the build.
rootProject.allprojects {
    repositories {
        // Local development against an unpublished native SDK: set uxtracker.localSdk=true in the app's
        // android/gradle.properties and run `./gradlew :uxtracker:publishReleasePublicationToMavenLocal`
        // in uxtracker-android-sdk.
        if (rootProject.findProperty("uxtracker.localSdk") == "true") {
            mavenLocal()
        }
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.wzagroup.uxtracker.flutter"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }
}

dependencies {
    implementation("com.github.JorgeLuisZB:uxtracker-android-sdk:1.0.0-beta.1")
}
