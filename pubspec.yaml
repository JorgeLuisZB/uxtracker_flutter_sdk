name: uxtracker_flutter_sdk
description: "UxTracker product analytics for Flutter. A thin wrapper over the native UxTracker Android and iOS SDKs."
version: 1.0.0-beta.1
publish_to: none
homepage: https://github.com/JorgeLuisZB/uxtracker_flutter_sdk

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.wzagroup.uxtracker.flutter
        pluginClass: UxTrackerFlutterPlugin
      ios:
        pluginClass: UxTrackerFlutterPlugin
